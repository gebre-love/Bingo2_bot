<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Addis Bingo</title>
    <style>
        :root { --primary: #1e272e; --accent: #eb4d4b; --gold: #f1c40f; --win: #27ae60; --bg: #2f3640; }
        body { font-family: sans-serif; background: var(--bg); margin: 0; color: white; height: 100vh; display: flex; flex-direction: column; align-items: center; }
        .app { width: 100%; max-width: 400px; padding: 10px; box-sizing: border-box; }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 100; display: flex; align-items: center; justify-content: center; }
        .modal { background: white; border-radius: 15px; padding: 20px; width: 80%; text-align: center; color: black; }
        .bet-btn { padding: 10px; margin: 5px; border-radius: 5px; border: 1px solid #ccc; cursor: pointer; font-weight: bold; }
        .ball-display { background: #2f3542; padding: 15px; border-radius: 15px; border: 2px solid var(--gold); margin-bottom: 10px; text-align: center; }
        .ball { width: 50px; height: 50px; background: white; color: black; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; }
        .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; background: white; padding: 10px; border-radius: 10px; }
        .cell { aspect-ratio: 1; background: #eee; color: black; display: flex; align-items: center; justify-content: center; font-weight: bold; border-radius: 5px; cursor: pointer; }
        .cell.marked { background: var(--win); color: white; }
        .bingo-btn { width: 100%; margin-top: 15px; background: var(--accent); color: white; border: none; padding: 15px; border-radius: 30px; font-size: 20px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
<div class="app">
    <div id="bet-overlay" class="overlay">
        <div class="modal">
            <h3>መወራረጃ ይምረጡ</h3>
            <button class="bet-btn" onclick="start(10)">10 ETB</button>
            <button class="bet-btn" onclick="start(20)">20 ETB</button>
        </div>
    </div>

    <div class="ball-display">
        <div class="ball" id="current-ball">-</div>
        <p>ሽልማት፡ <span id="win-amt">0</span> ETB</p>
    </div>

    <div class="grid" id="card-grid"></div>
    <button class="bingo-btn" onclick="checkBingo()">BINGO!</button>
</div>

<script>
    let drawn = [], stake = 0, myNumbers = [];
    const RENDER_URL = "https://bingo2-bot.onrender.com";

    function start(amt) {
        stake = amt;
        document.getElementById('bet-overlay').style.display = 'none';
        document.getElementById('win-amt').innerText = Math.floor(amt * 1.8);
        initCard();
        setInterval(draw, 4000);
    }

    function initCard() {
        const grid = document.getElementById('card-grid');
        for(let i=0; i<25; i++) {
            let n = Math.floor(Math.random() * 75) + 1;
            let div = document.createElement('div');
            div.className = 'cell';
            div.innerText = (i === 12) ? "FREE" : n;
            if(i === 12) div.classList.add('marked');
            div.onclick = () => { if(drawn.includes(n)) div.classList.add('marked'); };
            grid.appendChild(div);
        }
    }

    function draw() {
        let n = Math.floor(Math.random() * 75) + 1;
        if(!drawn.includes(n)) {
            drawn.push(n);
            document.getElementById('current-ball').innerText = n;
        }
    }

    function checkBingo() {
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('userId');
        
        fetch(`${RENDER_URL}/secure-win`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ userId, winAmount: Math.floor(stake * 1.8), secretKey: "BINGO_SECRET_99" })
        }).then(() => alert("ቢንጎ! 🎉"));
    }
</script>
</body>
</html>
